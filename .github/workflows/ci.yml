name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# As actions ficam presas a um commit (SHA), com a versão no comentário: uma
# tag movida por quem controla a action não muda o que roda aqui. O dependabot
# propõe a atualização.
jobs:
  nucleo:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: nucleo/go.mod
          cache-dependency-path: nucleo/go.sum
      - name: Formatação
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l nucleo)"
      - run: go -C nucleo vet ./...
      - run: go -C nucleo build ./...
      - name: Testes
        if: runner.os == 'Linux'
        run: go -C nucleo test -race ./...
      # No Windows sem -race (pediria o gcc): canal, ConPTY, navegador e caminhos.
      - name: Testes no Windows
        if: runner.os == 'Windows'
        run: go -C nucleo test ./...
      - name: Vulnerabilidades conhecidas
        if: runner.os == 'Linux'
        run: go -C nucleo run golang.org/x/vuln/cmd/govulncheck@latest ./...

  app:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
      - name: Bibliotecas do sistema
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libgtk-3-dev
      - run: cargo fmt --all --check
      - run: cargo build --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  dependencias:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # O cargo audit direto: a action de antes precisava criar um "check" no
      # GitHub, o que um pull request do dependabot não tem permissão de fazer.
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit

  # Procura segredos (tokens, chaves) no histórico inteiro, não só no último commit.
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
