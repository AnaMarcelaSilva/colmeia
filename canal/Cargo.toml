[package]
name = "canal"
description = "Canal local da Colmeia: o socket Unix e o token do núcleo, e a conversa com o colmeia-voz, para a tela e a abelha fixa."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
tungstenite = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
# Socket Unix (AF_UNIX) no Windows 10 1803+ e 11: o mesmo canal do Linux.
uds_windows = "1.2"
