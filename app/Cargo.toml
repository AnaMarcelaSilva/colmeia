[package]
name = "colmeia"
description = "Tela da Colmeia: quadro de tarefas, terminais dos agentes e a abelha."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
mascote = { path = "../mascote" }
alacritty_terminal = "0.26"
eframe.workspace = true
tungstenite = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
arboard = "3.6.1"
png = "0.18.1"
rfd = "0.17.2"

[target.'cfg(unix)'.dependencies]
# poll(2) no terminal: a thread de rede dorme até chegar saída ou digitação.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Socket Unix (AF_UNIX) no Windows 10 1803+ e 11: o mesmo canal do Linux.
uds_windows = "1.2"
windows-sys = { version = "0.60", features = ["Win32_Networking_WinSock", "Win32_System_Threading"] }
